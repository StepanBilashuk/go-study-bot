# /start calibration (emit → paste JSON back). Rendered with the full topic list.
template: |
  Calibrate my interview prep. Below are the topics. For EACH, I'll explain it in
  two sentences (or say when I'd apply it) — interview me one topic at a time, or
  let me dump several at once. Score each answer 1-5:
    1 = no working knowledge
    2 = recognises the term only
    3 = can define it, cannot apply it
    4 = can apply it, has used it
    5 = can teach it and knows the trade-offs
  Do not teach. Do not correct. Only assess.

  Topics:
  {{topics}}

  When we're done, output ONLY this JSON (no prose, no markdown fences), echoing
  each slug exactly:
  {"scores":[{"topic":"<slug>","confidence":1-5,"note":"<max 12 words>"}]}
